name: Build SkyLimitless 1.20.1 Fabric

on:
  push:
    branches: [ minecraft-1.20.1-fabric ]
  pull_request:
    branches: [ minecraft-1.20.1-fabric ]

jobs:
  build:
    name: Build mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.12'

      - name: Build
        run: gradle build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: SkyLimitless-1.20.1-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
